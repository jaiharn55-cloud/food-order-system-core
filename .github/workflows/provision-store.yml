name: Provision Store Instance

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target store repository, e.g. jaiharn55-cloud/food-order-khaokaeng'
        required: true
        default: 'jaiharn55-cloud/food-order-khaokaeng'
      store_id:
        description: 'Store ID'
        required: true
      shop_name:
        description: 'Shop name'
        required: true
      provider:
        description: 'Provider'
        required: false
        default: 'Wichai'
      liff_id:
        description: 'LIFF ID; leave blank until LIFF exists'
        required: false
      liff_url:
        description: 'LIFF URL; leave blank until LIFF exists'
        required: false
      api_url:
        description: 'Apps Script Web App /exec URL; leave blank until deployed'
        required: false
      line_login_channel_id:
        description: 'LINE Login Channel ID'
        required: false
      line_messaging_channel_id:
        description: 'LINE Messaging API Channel ID'
        required: false
      cash_active:
        description: 'Enable cash payment (true/false)'
        required: true
        default: 'true'
      promptpay_active:
        description: 'Enable PromptPay (true/false)'
        required: true
        default: 'false'
      government_active:
        description: 'Enable government payment (true/false)'
        required: true
        default: 'false'
      pickup_start:
        description: 'Pickup start HH:mm'
        required: true
        default: '08:00'
      pickup_end:
        description: 'Pickup end HH:mm'
        required: true
        default: '17:00'
      pickup_interval:
        description: 'Pickup interval in minutes'
        required: true
        default: '20'
      pickup_capacity:
        description: 'Capacity per slot'
        required: true
        default: '10'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target token
        env:
          TARGET_REPO_TOKEN: ${{ secrets.STORE_GITHUB_TOKEN }}
        run: |
          test -n "$TARGET_REPO_TOKEN" || {
            echo 'Missing repository secret STORE_GITHUB_TOKEN'
            exit 1
          }

      - name: Checkout Core
        uses: actions/checkout@v4

      - name: Clone target store repository
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_REPO_TOKEN: ${{ secrets.STORE_GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TARGET_REPO_TOKEN}@github.com/${TARGET_REPO}.git" target

      - name: Build store package
        env:
          STORE_ID: ${{ inputs.store_id }}
          SHOP_NAME: ${{ inputs.shop_name }}
          PROVIDER: ${{ inputs.provider }}
          LIFF_ID: ${{ inputs.liff_id }}
          LIFF_URL: ${{ inputs.liff_url }}
          API_URL: ${{ inputs.api_url }}
          LINE_LOGIN_CHANNEL_ID: ${{ inputs.line_login_channel_id }}
          LINE_MESSAGING_CHANNEL_ID: ${{ inputs.line_messaging_channel_id }}
          CASH_ACTIVE: ${{ inputs.cash_active }}
          PROMPTPAY_ACTIVE: ${{ inputs.promptpay_active }}
          GOVERNMENT_ACTIVE: ${{ inputs.government_active }}
          PICKUP_START: ${{ inputs.pickup_start }}
          PICKUP_END: ${{ inputs.pickup_end }}
          PICKUP_INTERVAL: ${{ inputs.pickup_interval }}
          PICKUP_CAPACITY: ${{ inputs.pickup_capacity }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request

          target = pathlib.Path('target')
          target.mkdir(exist_ok=True)

          prod_commit = '7ceb6c1a83fe7d6db7f27352d864e41d86840a92'
          prod_base = f'https://raw.githubusercontent.com/jaiharn55-cloud/food-order-liff/{prod_commit}'
          core_base = 'https://raw.githubusercontent.com/jaiharn55-cloud/food-order-system-core/main'

          def download(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'food-order-store-builder'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode('utf-8')

          def val(key, default=''):
              return os.environ.get(key, default) or default

          shop_name = val('SHOP_NAME')
          liff_id = val('LIFF_ID') or '__LIFF_ID__'
          api_url = val('API_URL') or '__API_URL__'

          # Customer frontend: source of truth is production baseline.
          index = download(prod_base + '/index.html')
          index = index.replace('2011202604-C2aNSUPF', liff_id)
          index = index.replace('AKfycby630JecNzApWvBQCY1mpsA4rS9tMHqtKidSmcE5Vz4GsVwfOHu2mKE0hmHkJ00HfdA', api_url)
          index = index.replace('ร้านข้าวแกง ตามสั่ง', shop_name)
          index = re.sub(r'(<title>)(.*?)(</title>)', lambda m: m.group(1) + shop_name + m.group(3), index, count=1, flags=re.S)
          (target / 'index.html').write_text(index, encoding='utf-8')

          # Admin frontend: same production baseline, store-aware values.
          admin = download(prod_base + '/admin.html')
          admin = admin.replace('2011202604-C2aNSUPF', liff_id)
          admin = admin.replace('AKfycby630JecNzApWvBQCY1mpsA4rS9tMHqtKidSmcE5Vz4GsVwfOHu2mKE0hmHkJ00HfdA', api_url)
          admin = admin.replace('ร้านข้าวแกง ตามสั่ง', shop_name)
          admin = re.sub(r'(<title>)(.*?)(</title>)', lambda m: m.group(1) + shop_name + m.group(3), admin, count=1, flags=re.S)
          (target / 'admin.html').write_text(admin, encoding='utf-8')

          # Full Store-aware backend Golden Master.
          backend_url = core_base + '/golden-master/backend/CORE_BACKEND_MASTER.gs'
          backend = download(backend_url)
          (target / 'backend').mkdir(parents=True, exist_ok=True)
          (target / 'backend' / 'Code.gs').write_text(backend, encoding='utf-8')

          # Store configuration - intentionally excludes secrets.
          config = {
              'STORE_ID': val('STORE_ID'),
              'SHOP_NAME': shop_name,
              'PROVIDER': val('PROVIDER'),
              'LIFF_ID': val('LIFF_ID'),
              'LIFF_URL': val('LIFF_URL'),
              'API_URL': val('API_URL'),
              'GITHUB_OWNER': 'jaiharn55-cloud',
              'GITHUB_REPO': os.environ.get('TARGET_REPO', '').split('/', 1)[-1],
              'GITHUB_BRANCH': 'main',
              'GITHUB_IMAGE_DIR': 'images/menu',
              'LINE_LOGIN_CHANNEL_ID': val('LINE_LOGIN_CHANNEL_ID'),
              'LINE_MESSAGING_CHANNEL_ID': val('LINE_MESSAGING_CHANNEL_ID'),
              'PAYMENT': {
                  'CASH_ACTIVE': val('CASH_ACTIVE', 'true').lower() == 'true',
                  'PROMPTPAY_ACTIVE': val('PROMPTPAY_ACTIVE', 'false').lower() == 'true',
                  'GOVERNMENT_ACTIVE': val('GOVERNMENT_ACTIVE', 'false').lower() == 'true'
              },
              'PICKUP': {
                  'START': val('PICKUP_START', '08:00'),
                  'END': val('PICKUP_END', '17:00'),
                  'INTERVAL_MIN': int(val('PICKUP_INTERVAL', '20')),
                  'CAPACITY': int(val('PICKUP_CAPACITY', '10'))
              },
              'STATUS': 'PROVISIONED'
          }

          (target / 'config').mkdir(parents=True, exist_ok=True)
          (target / 'config' / 'store-config.json').write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          # Apps Script manifest for the store backend.
          (target / 'backend' / 'appsscript.json').write_text(json.dumps({
              'timeZone': 'Asia/Bangkok',
              'exceptionLogging': 'STACKDRIVER',
              'runtimeVersion': 'V8'
          }, indent=2) + '\n', encoding='utf-8')

          # Simple backend status page for the Apps Script root.
          (target / 'backend' / 'Index.html').write_text('''<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOOD ORDER API</title></head><body><h2>FOOD ORDER SYSTEM API</h2><p>Store: %s</p><p>Store ID: %s</p><p>API พร้อมใช้งานเมื่อ Apps Script ถูก Deploy เป็น Web App</p></body></html>''' % (shop_name, val('STORE_ID')), encoding='utf-8')

          (target / 'README.md').write_text(f'''# FOOD ORDER SYSTEM - {shop_name}\n\nStore Instance: `{val('STORE_ID')}`\nProvider: `{val('PROVIDER')}`\n\nThis repository is generated from FOOD ORDER SYSTEM CORE Golden Master.\nProduction repository is not modified by this workflow.\n\n## Package\n- Customer: `index.html`\n- Admin: `admin.html`\n- Backend: `backend/Code.gs`\n- Apps Script manifest: `backend/appsscript.json`\n- Store config: `config/store-config.json`\n\n## Secrets\nNever commit LINE channel access tokens, GitHub tokens, Admin PINs, or other secrets here.\n''', encoding='utf-8')

          (target / '.nojekyll').write_text('', encoding='utf-8')
          PY

      - name: Commit store package
        working-directory: target
        env:
          TARGET_REPO_TOKEN: ${{ secrets.STORE_GITHUB_TOKEN }}
          SHOP_NAME: ${{ inputs.shop_name }}
          STORE_ID: ${{ inputs.store_id }}
        run: |
          git config user.name 'FOOD ORDER SYSTEM Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet && echo 'No changes to commit' && exit 0
          git commit -m "Provision store ${STORE_ID} - ${SHOP_NAME}"
          git push origin main
