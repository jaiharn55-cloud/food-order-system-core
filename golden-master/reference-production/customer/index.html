<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ร้านข้าวแกง ตามสั่ง</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#222;font-family:Arial,"Noto Sans Thai",sans-serif;padding-bottom:88px}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.header{background:#006b38;color:#fff;padding:18px 16px 20px;text-align:center;position:sticky;top:0;z-index:20}
.header h1{margin:0;font-size:23px}.header p{margin:6px 0 0;font-size:13px;opacity:.92}
.container{max-width:720px;margin:auto;padding:12px}
.section{margin:16px 0 8px;display:flex;justify-content:space-between;align-items:end}.section h2{margin:0;font-size:20px}.section small{color:#777}
.category-bar{position:sticky;top:71px;z-index:15;display:flex;gap:7px;overflow:auto;padding:8px 0 10px;background:#f5f5f5}
.category-btn{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 12px;color:#444}
.category-btn.active{background:#006b38;border-color:#006b38;color:#fff;font-weight:800}
.card{background:#fff;border-radius:15px;padding:13px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.menu-grid{display:grid;gap:10px}.menu-card{position:relative;overflow:hidden;padding:0;display:flex;min-height:116px}
.menu-image,.menu-placeholder{width:120px;height:120px;flex:0 0 120px;background:#eee}
.menu-image{object-fit:cover}.menu-placeholder{display:flex;align-items:center;justify-content:center;font-size:42px}
.menu-body{flex:1;padding:12px;min-width:0}.menu-title{font-size:17px;font-weight:900;line-height:1.25}
.menu-desc{color:#666;font-size:12px;margin-top:4px;line-height:1.4}.menu-price{margin-top:7px;font-size:17px;font-weight:900;color:#0a7c40}
.menu-actions{margin-top:9px;display:flex;gap:6px}.btn-green{border:0;background:#06c755;color:#fff;padding:9px 12px;border-radius:9px;font-weight:900}
.btn-outline{border:1px solid #0a7c40;background:#fff;color:#0a7c40;padding:9px 12px;border-radius:9px;font-weight:900}
.badge{position:absolute;top:8px;left:8px;background:#ffd54a;color:#594500;border-radius:999px;padding:4px 7px;font-size:11px;font-weight:900;z-index:2}
.special-wrap{background:linear-gradient(135deg,#fff7db,#fff);border:1px solid #f3d780}
.daily-wrap{background:linear-gradient(135deg,#effcf4,#fff);border:1px solid #cfead9}
.floating-cart{position:fixed;left:12px;right:12px;bottom:12px;z-index:50;border:0;background:#006b38;color:#fff;padding:13px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:space-between;font-weight:900}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;padding:12px;overflow:auto}.modal-backdrop.show{display:block}
.modal{width:min(680px,100%);margin:20px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal-head{background:#006b38;color:#fff;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}
.modal-close{width:36px;height:36px;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:9px;font-size:20px}
.modal-body{padding:15px}.option-group{margin-bottom:15px;padding-bottom:12px;border-bottom:1px solid #eee}.option-title{font-weight:900;margin-bottom:7px}
.option-row{display:flex;align-items:center;gap:8px;padding:8px 0}.qty-box{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0}
.qty-btn{width:42px;height:42px;border:0;border-radius:10px;background:#eee;font-size:22px}
textarea.field,input.field{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;margin-top:6px}
.summary-total{font-size:21px;font-weight:900;border-top:1px solid #eee;margin-top:8px;padding-top:10px}
.payment-choice{border:1px solid #ddd;border-radius:10px;padding:11px;margin-top:8px}.payment-choice.active{border-color:#06c755;background:#f1fff6}
.qr-box{margin-top:10px;text-align:center;padding:10px;background:#fafafa;border-radius:10px}.qr-box img{max-width:260px;width:100%;display:block;margin:8px auto;background:#fff}
.slot-list{display:grid;gap:7px;margin-top:7px}.slot-row{display:flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:10px;padding:10px}.slot-row.full{opacity:.5}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(12px);z-index:120;max-width:calc(100vw - 30px);background:rgba(20,20,20,.94);color:#fff;padding:11px 15px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;transition:.18s;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.success-order{text-align:center;padding:22px 12px}.order-id{font-size:50px;font-weight:1000;color:#006b38;margin:12px 0}
.empty{text-align:center;color:#888;padding:25px 10px}.loading,.error-page{text-align:center;padding:40px 20px}.error-page h2{color:#b00020}
.mini-help{color:#777;font-size:12px;line-height:1.5}

/* ===== CUSTOMER CONFIRM / CART FIX ===== */

.section-title{
  font-size:17px;
  font-weight:900;
  margin:0 0 9px;
  color:#333;
}

.cart-item{
  border-bottom:1px solid #ececec;
  padding:12px 0;
}

.cart-item:last-child{
  border-bottom:0;
}

.cart-item-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.cart-item-name{
  font-size:16px;
  font-weight:900;
  line-height:1.35;
  flex:1;
  min-width:0;
}

.cart-item-price{
  font-weight:900;
  white-space:nowrap;
}

.cart-item-meta{
  color:#666;
  font-size:12px;
  line-height:1.5;
  margin-top:5px;
}

.cart-item-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:8px;
}

.cart-remove-btn{
  border:1px solid #d64b4b;
  background:#fff5f5;
  color:#b00020;
  padding:7px 12px;
  border-radius:8px;
  font-weight:900;
  min-width:70px;
}

.cart-remove-btn:active{
  transform:scale(.98);
}

.payment-choice{
  display:block;
  width:100%;
  margin-top:8px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  background:#fff;
  color:#222;
  cursor:pointer;
}

.payment-choice:first-of-type{
  margin-top:0;
}

.payment-choice input{
  margin:0 8px 0 0;
  vertical-align:middle;
}

.payment-choice.active{
  border-color:#06c755;
  background:#f1fff6;
  box-shadow:0 0 0 1px rgba(6,199,85,.08);
}

.payment-choice b{
  vertical-align:middle;
}

.payment-choice .mini-help{
  margin-left:25px !important;
  margin-top:3px;
}

.slot-row{
  width:100%;
  background:#fff;
}

.slot-row input{
  flex:0 0 auto;
}

.pickup-note{
  margin-top:7px;
  color:#777;
  font-size:12px;
}

.confirm-card{
  margin-bottom:10px;
}

.confirm-actions{
  display:grid;
  gap:8px;
  margin-top:10px;
}

.confirm-primary{
  width:100%;
  padding:13px;
  font-size:16px;
}

.confirm-secondary{
  width:100%;
  margin-top:0;
}

@media (max-width: 420px){
  .cart-item-head{
    gap:8px;
  }

  .cart-item-name{
    font-size:15px;
  }

  .payment-choice{
    padding:11px;
  }
}


.my-orders-btn{width:100%;margin-top:9px;border:1px solid #006b38;background:#fff;color:#006b38;padding:10px 12px;border-radius:10px;font-weight:900}
.order-history-card{background:#fff;border-radius:14px;padding:12px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.order-history-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.order-history-id{font-size:22px;font-weight:1000;color:#006b38}
.order-history-status{font-size:12px;font-weight:900;text-align:right}.order-history-status.new,.order-history-status.preparing{color:#c06a00}.order-history-status.ready{color:#087a37}.order-history-status.completed{color:#777}.order-history-status.cancelled{color:#b00020}
.order-history-item{font-size:12px;color:#555;margin-top:4px}
</style>
</head>
<body>
<div id="app"><div class="loading"><h2>🍱 กำลังโหลดร้านอาหาร...</h2></div></div>
<div id="toast" class="toast"></div>

<script>
const LIFF_ID = "2011202604-C2aNSUPF";
const API_URL = "https://script.google.com/macros/s/AKfycby630JecNzApWvBQCY1mpsA4rS9tMHqtKidSmcE5Vz4GsVwfOHu2mKE0hmHkJ00HfdA/exec";
const FRONTEND_VERSION = "FRONT-V4-CUSTOMER-CURRY-FIX";

let DATA={menus:[],options:[],slots:[],dailyDishes:[],specialMenus:[],payment:{}};
let cart=[];
let currentCategory="ทั้งหมด";
let currentMenu=null;
let tempQty=1;
let toastTimer=null;

window.addEventListener("load",startApp);

async function startApp(){
  try{
    await liff.init({liffId:LIFF_ID});

    /*
     * LIFF Login
     * - ถ้าเปิดจาก LINE และได้ Session แล้ว ใช้ต่อได้ทันที
     * - ถ้ายังไม่มี LIFF login ให้เริ่ม login อัตโนมัติ
     *   แทนการปล่อยให้ไปเจอ error ตอนกดยืนยันออเดอร์
     */
    if (!liff.isLoggedIn()) {

      if (liff.isInClient()) {
        /*
         * ใน LINE App ให้ลอง getProfile ก่อน
         * บางกรณี isLoggedIn() ยังไม่อัปเดตทันที
         */
        try {
          await liff.getProfile();
        } catch (profileError) {
          throw new Error(
            'ไม่สามารถอ่านข้อมูล LINE ได้ กรุณาปิดหน้านี้แล้วเปิดร้านจาก LINE ใหม่'
          );
        }

      } else {

        const redirectUri =
          window.location.href;

        liff.login({
          redirectUri: redirectUri
        });

        return;
      }
    }

    /*
     * ตรวจ profile ตั้งแต่ตอนเปิดหน้า
     * เพื่อไม่ให้รอจนกด "ยืนยันออเดอร์"
     */
    if (liff.isLoggedIn()) {
      await liff.getProfile();
    }

    await loadData();


    /*
     * Rich Menu B
     * เปิด:
     * https://liff.line.me/2011202604-C2aNSUPF?page=orders
     */
    const requestedPage =
      new URLSearchParams(
        window.location.search
      ).get('page');


    if (
      requestedPage ===
      'orders' &&
      typeof openMyOrders ===
      'function'
    ) {

      await openMyOrders();

    }


  }catch(error){
    showError(
      error.message || String(error)
    );
  }
}

async function loadData(){

  const url =
    API_URL +
    "?action=getInitialData";

  console.log(
    "CUSTOMER API URL =",
    url
  );

  const response =
    await fetch(url);

  if (!response.ok) {

    let detail = "";

    try {
      detail =
        await response.text();
    } catch (e) {}

    console.error(
      "GET INITIAL DATA ERROR",
      {
        status:
          response.status,
        statusText:
          response.statusText,
        body:
          detail
      }
    );

    throw new Error(
      "โหลดข้อมูลร้านไม่สำเร็จ (" +
      response.status +
      ")"
    );
  }

  DATA =
    await response.json();

  DATA.dailyDishes =
    (DATA.dailyDishes || [])
      .map(function(dish) {
        return Object.assign(
          {
            available: true
          },
          dish
        );
      });

  if (
    !DATA ||
    !Array.isArray(DATA.menus)
  ) {
    throw new Error(
      "ข้อมูลเมนูจากร้านไม่ถูกต้อง"
    );
  }

  renderMenu();
}

function showError(message){
  document.getElementById("app").innerHTML=
    '<div class="error-page"><h2>⚠️ เกิดข้อผิดพลาด</h2><div>'+escapeHtml(message)+'</div><button class="btn-green" style="margin-top:15px" onclick="loadData()">ลองใหม่</button></div>';
}

function showToast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),1800);
}

function escapeHtml(text){
  return String(text??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function escapeJs(text){return String(text??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g," ");}

function cartTotal(){
  return cart.reduce((sum,item)=>{
    const opt=(item.options||[]).reduce((s,o)=>s+Number(o.price||0),0);
    return sum+(Number(item.price||0)+opt)*Number(item.qty||1);
  },0);
}
function cartCount(){return cart.reduce((sum,item)=>sum+Number(item.qty||1),0);}

function renderMenu(){

  const mainCategories = [
    ...new Set(
      (DATA.menus || [])
        .filter(function(menu){
          return menu.menuType !== 'SPECIAL' &&
            !['M022','M023','M024'].includes(
              String(menu.id)
            );
        })
        .map(function(menu){
          return String(menu.category || '').trim();
        })
        .filter(Boolean)
    )
  ];

  const categories = [
    'ทั้งหมด',
    'อาหารตามสั่ง',
    '🍲 ข้าวราดแกง',
    '⭐ เมนูพิเศษ'
  ];

  // กัน category ซ้ำ และเพิ่ม category อื่นที่มีอยู่จริง
  mainCategories.forEach(function(category){
    if (
      category &&
      !categories.includes(category)
    ) {
      categories.splice(
        categories.length - 2,
        0,
        category
      );
    }
  });

  document.getElementById("app").innerHTML =
    '<div class="header">' +
      '<h1>🍱 ร้านข้าวแกง ตามสั่ง</h1>' +
      '<p>สั่งล่วงหน้า • เลือกเวลารับได้ • ไม่ต้องรอคิวนาน</p>' +
    '</div>' +

    '<div class="container">' +

      '<button class="my-orders-btn" onclick="openMyOrders()">' +
        '📋 ออเดอร์ของฉัน' +
      '</button>' +

      '<div class="category-bar">' +

        categories.map(function(category){

          return (
            '<button class="category-btn ' +
              (
                currentCategory === category
                  ? 'active'
                  : ''
              ) +
            '" onclick="selectCategory(\'' +
              escapeJs(category) +
            '\')">' +
              escapeHtml(category) +
            '</button>'
          );

        }).join("") +

      '</div>' +

      '<div id="menuList"></div>' +

    '</div>' +

    '<button class="floating-cart" onclick="openCart()">' +
      '<span>🛒 ตะกร้า ' +
        cartCount() +
        ' รายการ</span>' +
      '<span>' +
        cartTotal().toLocaleString("th-TH") +
        ' บาท →' +
      '</span>' +
    '</button>';

  renderMenuList();
}

function renderSpecialSection(){
  const specials=(DATA.specialMenus||[]).filter(m=>m.available);
  if(!specials.length)return "";
  return '<div class="section"><h2>⭐ เมนูพิเศษวันนี้</h2><small>เมนูเฉพาะวัน</small></div><div class="menu-grid">'+specials.map(menuCardHtml).join("")+'</div>';
}

function renderDailySection(){

  const dishes =
    (DATA.dailyDishes || [])
      .filter(function(d) {
        return d.available !== false;
      });

  if (!dishes.length) {
    return "";
  }

  const packageIds = [
    "M022",
    "M023",
    "M024"
  ];

  const packages =
    packageIds
      .map(function(id) {
        return DATA.menus.find(function(menu) {
          return menu.id === id;
        });
      })
      .filter(Boolean);

  return (
    '<div class="section">' +
      '<h2>🍲 ข้าวราดแกงวันนี้</h2>' +
      '<small>' +
        dishes.length +
        ' อย่าง' +
      '</small>' +
    '</div>' +

    '<div class="card daily-wrap">' +

      '<div class="mini-help">' +
        'วันนี้มี ' +
        dishes.length +
        ' อย่าง • ' +
        'เลือก 1 / 2 / 3 อย่าง ' +
        'แล้วเลือกกับข้าวในขั้นถัดไป' +
      '</div>' +

      '<div class="menu-grid" style="margin-top:9px">' +

        packages
          .map(function(menu) {
            return menuCardHtml(
              menu,
              false
            );
          })
          .join("") +

      '</div>' +

    '</div>'
  );
}

function menuCardHtml(menu,specialBadge=true){
  const special=menu.menuType==="SPECIAL";
  const image=menu.image?'<img class="menu-image" src="'+escapeHtml(menu.image)+'" alt="'+escapeHtml(menu.name)+'">':'<div class="menu-placeholder">'+(special?"⭐":"🍛")+'</div>';
  return '<div class="card menu-card">'+(special&&specialBadge?'<div class="badge">⭐ เมนูพิเศษ</div>':"")+image+
    '<div class="menu-body"><div class="menu-title">'+escapeHtml(menu.name)+'</div>'+
    (menu.description?'<div class="menu-desc">'+escapeHtml(menu.description)+'</div>':"")+
    '<div class="menu-price">'+Number(menu.price||0).toLocaleString("th-TH")+' บาท</div>'+
    '<div class="menu-actions"><button class="btn-green" onclick="openMenu(\''+escapeJs(menu.id)+'\')">เลือกเมนู</button></div></div></div>';
}

function renderMenuList(){

  const list =
    document.getElementById("menuList");

  if (!list) return;

  const allMenus =
    (DATA.menus || [])
      .filter(function(menu){
        return menu.available !== false;
      });

  const dailyPackages =
    allMenus.filter(function(menu){
      return [
        'M022',
        'M023',
        'M024'
      ].includes(
        String(menu.id)
      );
    });

  const normalMenus =
    allMenus.filter(function(menu){

      return menu.menuType !== 'SPECIAL' &&
        ![
          'M022',
          'M023',
          'M024'
        ].includes(
          String(menu.id)
        );

    });

  const specialMenus =
    (DATA.specialMenus || [])
      .filter(function(menu){
        return menu.available !== false;
      });

  let html = '';

  // ==============================
  // ทั้งหมด
  // ==============================
  if (currentCategory === 'ทั้งหมด') {

    if (specialMenus.length) {

      html +=
        '<div class="section">' +
          '<h2>⭐ เมนูพิเศษวันนี้</h2>' +
          '<small>เมนูเฉพาะวัน</small>' +
        '</div>' +

        '<div class="menu-grid">' +
          specialMenus
            .map(function(menu){
              return menuCardHtml(
                menu,
                true
              );
            })
            .join("") +
        '</div>';

    }

    const dishes =
      (DATA.dailyDishes || [])
        .filter(function(dish){
          return dish.available !== false;
        });

    if (
      dishes.length &&
      dailyPackages.length
    ) {

      html +=
        '<div class="section">' +
          '<h2>🍲 ข้าวราดแกงวันนี้</h2>' +
          '<small>' +
            dishes.length +
            ' อย่าง' +
          '</small>' +
        '</div>' +

        '<div class="menu-grid">' +
          dailyPackages
            .map(function(menu){
              return menuCardHtml(
                menu,
                false
              );
            })
            .join("") +
        '</div>';

    }

    if (normalMenus.length) {

      html +=
        '<div class="section">' +
          '<h2>🍛 อาหารตามสั่ง</h2>' +
        '</div>' +

        '<div class="menu-grid">' +
          normalMenus
            .map(menuCardHtml)
            .join("") +
        '</div>';

    }

    list.innerHTML =
      html ||
      '<div class="card empty">ไม่พบเมนู</div>';

    return;
  }

  // ==============================
  // เมนูพิเศษ
  // ==============================
  if (
    currentCategory === '⭐ เมนูพิเศษ'
  ) {

    list.innerHTML =
      specialMenus.length
        ? '<div class="menu-grid">' +
            specialMenus
              .map(function(menu){
                return menuCardHtml(
                  menu,
                  true
                );
              })
              .join("") +
          '</div>'
        : '<div class="card empty">' +
            'วันนี้ไม่มีเมนูพิเศษ' +
          '</div>';

    return;
  }

  // ==============================
  // ข้าวราดแกง
  // ==============================
  if (
    currentCategory === '🍲 ข้าวราดแกง'
  ) {

    const dishes =
      (DATA.dailyDishes || [])
        .filter(function(dish){
          return dish.available !== false;
        });

    list.innerHTML =
      dishes.length && dailyPackages.length
        ? '<div class="menu-grid">' +
            dailyPackages
              .map(function(menu){
                return menuCardHtml(
                  menu,
                  false
                );
              })

function timeToMinutes_(timeText){

  const match =
    String(timeText || '')
      .match(/^(\d{1,2}):(\d{2})/);

  if (!match) {
    return 9999;
  }

  return (
    Number(match[1]) * 60 +
    Number(match[2])
  );
}


function getCurrentMinutes_(){

  const now =
    new Date();

  return (
    now.getHours() * 60 +
    now.getMinutes()
  );
}


function renderSlots(){

  if (
    !Array.isArray(DATA.slots) ||
    !DATA.slots.length
  ) {

    return `
      <div class="mini-help"
        style="margin-top:8px">
        ไม่มีช่วงเวลาที่เปิดรับ
      </div>
    `;

  }

  const nowMinutes =
    getCurrentMinutes_();

  let options =
    '<option value="">-- เลือกเวลารับอาหาร --</option>';

  DATA.slots.forEach(function(slot){

    const startMinutes =
      timeToMinutes_(
        slot.start
      );

    const expired =
      startMinutes <= nowMinutes;

    const waiting =
      Number(
        slot.waiting ||
        slot.waitingCount ||
        0
      );

    const disabled =
      expired;

    let label = '';

    if (expired) {

      label =
        slot.start +
        ' - ' +
        slot.end +
        ' • ผ่านเวลาแล้ว';

    } else {

      label =
        slot.start +
        ' - ' +
        slot.end +
        ' • รอทำ ' +
        waiting +
        ' คิว';

    }

    options += `
      <option
        value="${escapeHtml(slot.id)}"
        ${disabled ? 'disabled' : ''}
      >
        ${escapeHtml(label)}
      </option>
    `;

  });

  return `
    <select
      id="pickupSlotSelect"
      name="pickupSlot"
      class="field"
      style="
        width:100%;
        padding:12px;
        font-size:16px;
        margin-top:8px;
      "
    >
      ${options}
    </select>
  `;
}

function removeCartItem(index){

  const target =
    Number(index);


  if(
    !Number.isInteger(target) ||
    target < 0 ||
    target >= cart.length
  ){

    return;

  }


  cart.splice(
    target,
    1
  );


  if(
    cart.length === 0
  ){

    renderMenu();

    showToast(

    );

    return;

  }


  openCart();


  showToast(

      try {

            : "";

        /*
         * กรณี LIFF ยังไม่ login และอยู่นอก LINE

        if (

        }

        );

      }

    }

    if (!userId) {

      throw new Error(
        "ไม่พบข้อมูล LINE User กรุณาเปิดหน้านี้จาก LINE ใหม่"
      );

    }

    showLoading("กำลังส่งออเดอร์...");

    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"createOrder",orderData:{
        userId,
        customerName,
        customerRemark:document.getElementById("customerRemark")?.value.trim()||"",
        pickupType:pickupType.value,
        pickupSlot,
        payment,
        items:cart.map(item=>({menuId:item.menuId,qty:item.qty,options:(item.options||[]).map(o=>({name:o.name})),remark:item.remark||""}))
      }})
    });
    if(!response.ok)throw new Error("ระบบร้านไม่ตอบสนอง");
    const result=await response.json();
    if(!result.success)throw new Error(result.error||"ไม่สามารถสร้างออเดอร์ได้");
    cart=[];showOrderSuccessV3(result);
  }catch(error){showInlineError(error.message||String(error));}
}

function showInlineError(message){
  document.getElementById("app").innerHTML='<div class="header"><h1>⚠️ ตรวจสอบข้อมูล</h1></div><div class="container"><div class="card" style="text-align:center"><div style="color:#b00020;font-weight:900">'+escapeHtml(message)+'</div><button class="btn-green" style="margin-top:12px" onclick="openCart()">← กลับไปแก้ไข</button></div></div>';
}
function showOrderSuccessV3(result){
  const slot = DATA.slots?.find(function(s){ return s.id === result.pickupSlot; });
  const pickupText = result.pickupType === 'SCHEDULED' && slot ? slot.start + ' - ' + slot.end : 'รับเร็วที่สุด';
  const payText = {CASH:'💵 เงินสด',QR:'📱 PromptPay',GOVERNMENT:'🏛️ โครงการรัฐ / ถุงเงิน'}[result.payment] || result.payment || '';

  document.getElementById('app').innerHTML = `
    <div class="header"><h1>✅ สั่งอาหารสำเร็จ</h1><p>ร้านได้รับออเดอร์แล้ว</p></div>
    <div class="container">
      <div class="card success-order">
        <div class="mini-help">หมายเลขออเดอร์</div>
        <div class="order-id">${escapeHtml(result.orderId || '')}</div>
        <div class="summary-total">${Number(result.total || 0).toLocaleString('th-TH')} บาท</div>
        <div class="card" style="margin-top:14px">
          <div>🕐 รับอาหาร <b>${escapeHtml(pickupText)}</b></div>
          <div style="margin-top:8px">${escapeHtml(payText)}</div>
        </div>
        <div class="mini-help">ไม่ต้องจำเลขออเดอร์ กด “ออเดอร์ของฉัน” เพื่อดูออเดอร์ล่าสุดได้</div>
      </div>
      <button class="btn-green" style="width:100%" onclick="openMyOrders()">📋 ดูออเดอร์ของฉัน</button>
      <button class="my-orders-btn" onclick="loadData()">🍱 สั่งอาหารเพิ่ม</button>
    </div>
  `;
}

async function getCurrentUserId_(){
  if(typeof liff === 'undefined') throw new Error('ไม่สามารถเชื่อมต่อ LINE ได้');
  try{
    const profile = await liff.getProfile();
    if(profile && profile.userId) return profile.userId;
  }catch(error){
    if(!liff.isLoggedIn() && !liff.isInClient()){
      liff.login({redirectUri:window.location.href});
      return null;
    }
  }
  throw new Error('ไม่พบข้อมูล LINE User กรุณาเปิดหน้านี้จาก LINE ใหม่');
}

function orderStatusText_(status){
  const map={NEW:'🆕 ออเดอร์ใหม่',PREPARING:'👨‍🍳 กำลังทำ',READY:'✅ พร้อมรับ',COMPLETED:'✔️ เสร็จแล้ว',CANCELLED:'❌ ยกเลิก'};
  return map[String(status||'').toUpperCase()] || String(status||'');
}

function orderPaymentText_(value){
  const map={CASH:'💵 เงินสด',QR:'📱 PromptPay',GOVERNMENT:'🏛️ โครงการรัฐ / ถุงเงิน'};
  return map[String(value||'').toUpperCase()] || String(value||'');
}

async function openMyOrders(){
  try{
    showLoading('กำลังโหลดออเดอร์ของคุณ...');
    const userId = await getCurrentUserId_();
    if(!userId) return;

    const response = await fetch(API_URL + '?action=getMyOrders&userId=' + encodeURIComponent(userId));
    if(!response.ok) throw new Error('โหลดออเดอร์ของคุณไม่สำเร็จ');
    const result = await response.json();
    if(!result || !result.success) throw new Error(result && result.error ? result.error : 'โหลดออเดอร์ของคุณไม่สำเร็จ');

    const orders = Array.isArray(result.orders) ? result.orders : [];
    let html = `
      <div class="header"><h1>📋 ออเดอร์ของฉัน</h1><p>ไม่ต้องจำเลขออเดอร์</p></div>
      <div class="container">
    `;

    if(!orders.length){
      html += '<div class="card empty">ยังไม่มีออเดอร์ของคุณวันนี้</div>';
    }else{
      orders.forEach(function(order){
        const status = String(order.status || '').toLowerCase();
        html += `
          <div class="order-history-card">
            <div class="order-history-head">
              <div>
                <div class="mini-help">${escapeHtml(order.date)} ${escapeHtml(order.time || '')}</div>
                <div class="order-history-id">${escapeHtml(order.orderId)}</div>
              </div>
              <div class="order-history-status ${escapeHtml(status)}">${escapeHtml(orderStatusText_(order.status))}</div>
            </div>
            <div class="mini-help" style="margin-top:6px">🕐 ${escapeHtml(order.pickupTime || 'รับเร็วที่สุด')}</div>
            <div class="mini-help" style="margin-top:4px">${escapeHtml(orderPaymentText_(order.payment))} • ${Number(order.total || 0).toLocaleString('th-TH')} บาท</div>
            ${(order.items || []).map(function(item){
              return '<div class="order-history-item">'+escapeHtml(item.menuName)+' × '+Number(item.qty || 0)+(item.options ? ' • '+escapeHtml(item.options) : '')+'</div>';
            }).join('')}
          </div>
        `;
      });
    }

    html += `
        <button class="btn-green" style="width:100%" onclick="loadData()">← กลับไปเลือกเมนู</button>
      </div>
    `;

    document.getElementById('app').innerHTML = html;
  }catch(error){
    showInlineError(error.message || String(error));
  }
}

function showLoading(message){document.getElementById("app").innerHTML='<div class="loading"><h2>🍱 ร้านข้าวแกง ตามสั่ง</h2><div>'+escapeHtml(message)+'</div></div>';}
</script>
</body>
</html>
